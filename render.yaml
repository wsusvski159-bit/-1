services:
  - type: web
    name: ayu-see-my-video
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NEWAPI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: NEWAPI_BASE_URL
        value: https://api.qiyiguo.uk
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-pro
      - key: MAX_UPLOAD_MB
        value: "80"
      - key: MAX_DURATION_SECONDS
        value: "60"
      - key: GEMINI_INLINE_TARGET_MB
        value: "14"
