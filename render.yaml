services:
  - type: web
    name: ayu-see-my-video
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: MAX_UPLOAD_MB
        value: "80"
      - key: MAX_DURATION_SECONDS
        value: "90"
      - key: MAX_FRAMES
        value: "8"
